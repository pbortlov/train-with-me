apiVersion: apps/v1
kind: Deployment
metadata:
  name: train-with-me-cloud-api
  labels:
    app: train-with-me-cloud
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: train-with-me-cloud
      component: api
  template:
    metadata:
      labels:
        app: train-with-me-cloud
        component: api
    spec:
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/replace-project/train-with-me-cloud-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TWM_ENVIRONMENT
              value: openshift
            - name: TWM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: train-with-me-cloud-secrets
                  key: database-url
            - name: TWM_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: train-with-me-cloud-secrets
                  key: jwt-secret-key
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: train-with-me-cloud
    component: api
spec:
  selector:
    app: train-with-me-cloud
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
