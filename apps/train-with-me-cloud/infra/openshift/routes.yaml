apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: train-with-me-cloud-web
  labels:
    app: train-with-me-cloud
    component: web
spec:
  to:
    kind: Service
    name: frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: train-with-me-cloud-api
  labels:
    app: train-with-me-cloud
    component: api
spec:
  path: /api
  to:
    kind: Service
    name: api
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
