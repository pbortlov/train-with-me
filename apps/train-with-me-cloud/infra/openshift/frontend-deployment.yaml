apiVersion: apps/v1
kind: Deployment
metadata:
  name: train-with-me-cloud-web
  labels:
    app: train-with-me-cloud
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: train-with-me-cloud
      component: web
  template:
    metadata:
      labels:
        app: train-with-me-cloud
        component: web
    spec:
      containers:
        - name: web
          image: image-registry.openshift-image-registry.svc:5000/replace-project/train-with-me-cloud-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: train-with-me-cloud
    component: web
spec:
  selector:
    app: train-with-me-cloud
    component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
