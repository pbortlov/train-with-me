image: node:22

stages:
  - test
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

validate-v1:
  stage: test
  script:
    - npm ci
    - npm run check

pages:
  stage: deploy
  script:
    - npm ci
    - npm run build
    - npm run smoke
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
